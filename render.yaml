services:
  # 1. The Backend
  - type: web
    name: mern-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false 
      - key: NODE_ENV
        value: production

  # 2. The Frontend (Fixed for routingRules)
  - type: static_site  # <--- Use this exact name
    name: mern-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routingRules:
      - route: /*
        rewritePath: /index.html
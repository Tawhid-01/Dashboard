services:
  # 1. The Node/Express Backend
  - type: web
    name: mern-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false 
      - key: NODE_ENV
        value: production

  # 2. The React Frontend (FIXED TYPE)
  - type: static_site
    name: mern-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist 
    routingRules:
      - route: /*
        rewritePath: /index.html
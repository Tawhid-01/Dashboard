services:
  # 1. The Node/Express Backend
  - type: static
    name: mern-backend
    env: node
    plan: free # This ensures you aren't charged
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false # You will manually paste this in the Render Dashboard
      - key: NODE_ENV
        value: production

  # 2. The React Frontend
  - type: web
    name: mern-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist # Change to ./build if using older Create React App
    routingRules:
      - route: /*
        rewritePath: /index.html # Handles React Router refreshes